services:
  vexobj:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - vexobj-data:/data
      - ./config/default.toml:/etc/vexobj/config.toml:ro
    environment:
      - VEXOBJ_CONFIG=/etc/vexobj/config.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2

volumes:
  vexobj-data:
